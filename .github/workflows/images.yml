# Builds the 6 service images on every push to main and publishes them to GHCR.
# Tags: the full commit SHA (immutable, used by deploys and rollbacks) and "latest".
name: images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "deploy/charts/woo-store/**"
      - "deploy/charts/hosted-mcp/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, provisioner, dashboard, woo-mcp, notes-mcp, fx-mcp]
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the GitHub username has capitals.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/urumi-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'provisioner' && '.' || format('services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'provisioner' && 'services/provisioner/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
