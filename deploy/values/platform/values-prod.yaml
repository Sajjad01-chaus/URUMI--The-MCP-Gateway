global:
  domain: urumi-sajjad.duckdns.org
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

postgres:
  storage:
    size: 10Gi

gateway:
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

stores:
  maxTotal: 2

provisioner:
  enabled: true
  apiServerCidrs:
    - 172.16.0.4/32
