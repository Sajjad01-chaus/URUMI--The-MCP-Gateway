{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-auth
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "secrets.mysqlRootPassword is required" $s.mysqlRootPassword | quote }}
  password: {{ required "secrets.mysqlPassword is required" $s.mysqlPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wp-admin
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "secrets.wpAdminUser is required" $s.wpAdminUser | quote }}
  password: {{ required "secrets.wpAdminPassword is required" $s.wpAdminPassword | quote }}
  email: {{ required "secrets.wpAdminEmail is required" $s.wpAdminEmail | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-api
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  consumer-key: {{ required "secrets.wooConsumerKey is required" $s.wooConsumerKey | quote }}
  consumer-secret: {{ required "secrets.wooConsumerSecret is required" $s.wooConsumerSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-auth
  labels: {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "secrets.wooMcpToken is required" $s.wooMcpToken | quote }}
{{- end }}
