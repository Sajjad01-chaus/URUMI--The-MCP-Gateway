global:
  # Seconds a stopping pod keeps serving before shutdown (lets endpoint removal propagate).
  preStopSleepSeconds: 5
  domain: 127-0-0-1.nip.io
  tls:
    enabled: false
    clusterIssuer: ""

store:
  subdomain: store
  title: Urumi Demo Store
  timezone: Asia/Kolkata
  currency: USD
  country: "US:CA"

mysql:
  image: mysql:8.4.9
  database: wordpress
  user: wordpress
  storage:
    size: 5Gi
    className: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

wordpress:
  image: wordpress:7.1.3-php8.3-apache
  storage:
    size: 5Gi
    className: ""
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 512Mi }

bootstrap:
  image: wordpress:cli-2.12.0-php8.3
  wooVersion: "11.2.1"
  sampleProducts: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

wooMcp:
  image: urumi/woo-mcp:dev
  imagePullPolicy: IfNotPresent
  timeoutSeconds: 15
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }
  # Only these pods may call woo-mcp (enforced by NetworkPolicy, plus the bearer token).
  allowedClients:
    namespace: platform
    podLabels:
      app.kubernetes.io/name: gateway

networkPolicy:
  enabled: true
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  provisionerReadiness:
    enabled: false
    namespace: platform
    podLabels:
      app.kubernetes.io/name: provisioner

quota:
  enabled: false
  requestsCpu: "1"
  requestsMemory: 1536Mi
  limitsCpu: "3"
  limitsMemory: 3Gi
  pods: "10"
  persistentVolumeClaims: "3"
  requestsStorage: 6Gi
  defaultRequest: { cpu: 50m, memory: 64Mi }
  defaultLimit: { cpu: 500m, memory: 256Mi }
  max: { cpu: "1", memory: 1Gi }

# Set create=false to use Secrets created outside Helm (same names/keys as templates/secrets.yaml).
secrets:
  create: true
  mysqlRootPassword: ""
  mysqlPassword: ""
  wpAdminUser: admin
  wpAdminPassword: ""
  wpAdminEmail: admin@urumi.local
  wooConsumerKey: ""
  wooConsumerSecret: ""
  wooMcpToken: ""
