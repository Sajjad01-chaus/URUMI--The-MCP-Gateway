{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.postgresPassword is required" $s.postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ required "secrets.sessionSecret is required" $s.sessionSecret | quote }}
  chat-token-secret: {{ required "secrets.chatTokenSecret is required" $s.chatTokenSecret | quote }}
  credential-encryption-key: {{ required "secrets.credentialEncryptionKey is required" $s.credentialEncryptionKey | quote }}
  bootstrap-admin-email: {{ required "secrets.bootstrapAdminEmail is required" $s.bootstrapAdminEmail | quote }}
  bootstrap-admin-password: {{ required "secrets.bootstrapAdminPassword is required" $s.bootstrapAdminPassword | quote }}
---
# Credentials for the built-in upstreams; the gateway encrypts them into Postgres on first start.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-seed-credentials
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  woo: {{ required "secrets.wooMcpToken is required" $s.wooMcpToken | quote }}
  notes: {{ required "secrets.notesMcpToken is required" $s.notesMcpToken | quote }}
  fx: {{ required "secrets.fxMcpApiKey is required" $s.fxMcpApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: notes-mcp-auth
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $s.notesMcpToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fx-mcp-auth
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $s.fxMcpApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llm
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $s.groqApiKey | quote }}
{{- end }}
