{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-gateway
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        {{- if .Values.provisioner.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: provisioner
        {{- end }}
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressController.namespace }}
          podSelector:
            matchLabels: {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-from-ingress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressController.namespace }}
          podSelector:
            matchLabels: {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upstreams-from-gateway
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      urumi.io/mcp-upstream: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: 8000
---
# Gateway egress: DNS, its database, MCP pods on :8000, and the public internet only.
# Blocks the Kubernetes API, node IPs, cloud metadata (169.254.169.254), MySQL, WordPress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels: {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              urumi.io/mcp-upstreams: "true"
          podSelector:
            matchLabels:
              urumi.io/mcp-upstream: "true"
      ports:
        - port: 1024
          endPort: 65535
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml $np.blockedEgressCidrs | nindent 14 }}
      ports:
        - port: 443
        - port: 80
{{- if .Values.provisioner.enabled }}
---
# Provisioner egress: DNS, Postgres, the Kubernetes API and HTTP readiness in managed namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provisioner-egress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provisioner
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels: {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              urumi.io/managed-by: provisioner
      ports:
        - port: 80
    {{- range .Values.provisioner.apiServerCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - port: 443
        - port: 6443
    {{- end }}
{{- end }}
{{- if .Values.global.tls.enabled }}
---
# Let's Encrypt HTTP-01: Traefik must reach cert-manager's short-lived solver pods (only those, only :8089).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver-from-ingress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressController.namespace }}
          podSelector:
            matchLabels: {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - port: 8089
{{- end }}
{{- end }}
