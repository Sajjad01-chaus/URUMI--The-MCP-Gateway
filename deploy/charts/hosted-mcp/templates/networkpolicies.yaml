apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels: {{- include "hosted.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-from-gateway
  labels: {{- include "hosted.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "hosted.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - { port: {{ .Values.mcp.port }}, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-egress
  labels: {{- include "hosted.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "hosted.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dnsPodLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if .Values.internetEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .Values.networkPolicy.blockedEgressCidrs | nindent 14 }}
      ports:
        - { port: 80, protocol: TCP }
        - { port: 443, protocol: TCP }
    {{- end }}
