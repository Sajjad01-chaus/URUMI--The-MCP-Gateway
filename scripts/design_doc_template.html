<title>Urumi MCP Gateway Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky contents rail on the left, a 72ch reading column; diagrams and tables may run wider inside their own scrollers. */
:root {
  --bg: #f5f7f8;
  --surface: #ffffff;
  --fg: #17232b;
  --muted: #5b6b75;
  --line: #d9e1e5;
  --accent: #0d766e;
  --accent-soft: #e2f1ef;
  --code-bg: #eef2f4;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161a; --surface: #151f25; --fg: #dbe4e8; --muted: #8fa1ab;
    --line: #26343c; --accent: #4cc0b3; --accent-soft: #15302d; --code-bg: #1a262d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161a; --surface: #151f25; --fg: #dbe4e8; --muted: #8fa1ab;
  --line: #26343c; --accent: #4cc0b3; --accent-soft: #15302d; --code-bg: #1a262d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--fg);
  font: 15.5px/1.65 var(--font-body);
  padding-inline: 16px; padding-block: 0;
}
.shell {
  display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 48px;
  max-width: 1240px; margin: 0 auto;
}
nav.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  max-height: 100vh; overflow-y: auto; padding-block: 40px;
}
nav.rail .label {
  font: 600 11px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}
nav.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.rail a {
  display: block; padding: 5px 10px; border-radius: 6px; color: var(--muted);
  text-decoration: none; font-size: 13.5px; line-height: 1.35;
}
nav.rail a:hover, nav.rail a:focus-visible { color: var(--fg); background: var(--code-bg); outline: none; }
nav.rail a.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; }

main { min-width: 0; padding-block: 40px 96px; }
main > * { max-width: 72ch; }
main > figure, main > .table-scroll, main > pre { max-width: 100%; }

h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.15; }
h1 { font-weight: 800; font-size: clamp(30px, 4.4vw, 46px); letter-spacing: -.02em; margin: 0 0 18px; }
h2 {
  font-weight: 800; font-size: 25px; letter-spacing: -.01em;
  margin: 64px 0 14px; padding-top: 22px; border-top: 1px solid var(--line);
  scroll-margin-top: 16px;
}
h3 { font-weight: 600; font-size: 18.5px; margin: 36px 0 10px; scroll-margin-top: 16px; }
p, ul, ol { margin: 0 0 14px; }
li + li { margin-top: 4px; }
a { color: var(--accent); }
strong { font-weight: 600; }
hr { display: none; }

blockquote {
  margin: 0 0 28px; padding: 14px 18px; background: var(--accent-soft);
  border-radius: 8px; color: var(--fg);
}
blockquote p { margin: 0; }
blockquote p + p { margin-top: 6px; }

code {
  font-family: var(--font-mono); font-size: .86em; background: var(--code-bg);
  padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere;
}
pre {
  background: var(--code-bg); border-radius: 8px; padding: 14px 16px;
  overflow-x: auto; font-size: 13px; line-height: 1.55;
}
pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }

.table-scroll { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th {
  font: 600 11.5px/1.3 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); background: var(--code-bg); white-space: nowrap;
}
tr:last-child td { border-bottom: 0; }

figure.diagram {
  margin: 8px 0 28px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 18px;
}
.diagram-scroll { overflow-x: auto; }
figure.diagram pre.mermaid { background: none; padding: 0; margin: 0; text-align: center; font-size: 14px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.rail { position: static; max-height: none; padding-block: 24px 0; }
  nav.rail ol { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  main { padding-block: 16px 64px; }
}
</style>

<div class="shell">
  <nav class="rail" aria-label="Contents">
    <div class="label">Contents</div>
    <ol>
{{TOC}}
    </ol>
  </nav>
  <main>
{{BODY}}
  </main>
</div>

<script>
(() => {
  const links = [...document.querySelectorAll("nav.rail a")];
  const byId = new Map(links.map(a => [a.getAttribute("href").slice(1), a]));
  const heads = [...document.querySelectorAll("main h2[id]")];
  if (!("IntersectionObserver" in window) || !heads.length) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => a.classList.remove("active"));
      byId.get(e.target.id)?.classList.add("active");
    });
  }, { rootMargin: "0px 0px -70% 0px" });
  heads.forEach(h => io.observe(h));
})();
</script>
