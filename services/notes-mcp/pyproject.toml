[project]
name = "notes-mcp"
version = "0.1.0"
description = "Demo upstream MCP server: team notes (bearer credential, fault injection)."
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "pydantic-settings>=2.6", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
