[project]
name = "woo-mcp"
version = "0.1.0"
description = "MCP server exposing a WooCommerce store's products and orders over Streamable HTTP."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
